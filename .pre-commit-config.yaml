# Git hooks run by pre-commit (https://pre-commit.com).
# Set up once per clone with: pre-commit install
repos:
  # Scans staged changes for secrets, using the rules in .gitleaks.toml.
  # Keep this version in step with .github/workflows/secret-scan.yml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
