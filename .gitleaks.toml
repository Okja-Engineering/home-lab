# Default rules for gitleaks.
#
# One of the two rule sets that scripts/secret-scan.sh applies, for the
# pre-commit hook and for the CI scan alike. The other is
# .gitleaks-talos.toml, the Talos rules. Written and checked against gitleaks
# v8.30.1, the version both of them pin.
#
# Extending the default config brings in every default rule and also the
# default allowlist, which exempts some paths from all of these rules (the
# common lock files, node_modules/, some vendor/ trees, names ending in .v2,
# .bin or .pdf, and more). That is why the Talos rules are not in this file:
# they must apply to every path.

title = "home-lab gitleaks config: default rules"

[extend]
useDefault = true
