name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Keep this version in step with .pre-commit-config.yaml.
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Full history, because the scan reads every commit HEAD is built on: a
      # secret that was added and then removed in a later commit is still
      # found. On a pull request HEAD is GitHub's test merge of the pull
      # request into its base, so that is the base branch's history, every
      # commit of the pull request, and the merge itself. On a push to main it
      # is the history of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release binary, not gitleaks/gitleaks-action: the action needs a
      # license key for repositories owned by an organization.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      # The script holds the gitleaks options and says what they do and do not
      # scan. It also fails the job when gitleaks could not read the history,
      # which gitleaks alone reports as a pass. The pre-commit hook runs the
      # same script on the staged changes.
      - name: Scan the commit history
        run: scripts/secret-scan.sh history

  # DEMONSTRATION ONLY. Not part of story/18-secret-scanning. DO NOT MERGE.
  # The scan exactly as it was reviewed (0f546a8, which is 7d34078 after the
  # rebases): the reviewed config at the reviewed path and the reviewed
  # options, run on the same commit as the job above. Where this job is green
  # and the job above is red, the reviewed scan passes what the repaired scan
  # fails.
  control-reviewed-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      REVIEWED: "7d340786ad8572b21dbf7cdebf0e19802335f203"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      - name: Scan the commit history as reviewed
        run: >-
          git show "${REVIEWED}:.gitleaks.toml" > .gitleaks.toml &&
          "${RUNNER_TEMP}/gitleaks/gitleaks" git
          --config .gitleaks.toml
          --log-opts="--full-history --diff-filter=tuxdb HEAD"
          --redact
          --verbose
          --no-banner

  # DEMONSTRATION ONLY. Not part of story/18-secret-scanning. DO NOT MERGE.
  # The pre-commit hook, run by pre-commit itself on the runner: it builds
  # gitleaks from the pinned commit and runs the hook's entry on staged
  # changes. Each step states what it expects and fails if it sees anything
  # else, so this job is green only when the hook passes a clean change and
  # blocks each fixture. The fixtures are repeated letters, not key material.
  hook-demo:
    runs-on: ubuntu-latest
    env:
      PRE_COMMIT: "pipx run --spec pre-commit==4.7.0 pre-commit"
      REVIEWED: "7d340786ad8572b21dbf7cdebf0e19802335f203"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The hook as reviewed, for the control runs below
        run: git show "${REVIEWED}:.pre-commit-config.yaml" > "${RUNNER_TEMP}/reviewed-hook.yaml"
      - name: A clean staged change passes the hook
        run: |
          mkdir -p ci-demo
          echo "a benign staged change" > ci-demo/benign.txt
          git add ci-demo/benign.txt
          ${PRE_COMMIT} run
      # The fixture is assembled here so that this file does not itself hold
      # the shapes the rules look for.
      - name: A staged fake token and fake 32-byte secret are blocked
        run: |
          {
            echo '# FAKE FIXTURE. NOT A SECRET. Repeated letters only.'
            printf 'anyName: %s.%s\n' aaaaaa bbbbbbbbbbbbbbbb
            printf 'otherName: %s=\n' "$(printf 'A%.0s' {1..43})"
          } > ci-demo/hook-fixture.yaml
          git add ci-demo/hook-fixture.yaml
          if ${PRE_COMMIT} run > "${RUNNER_TEMP}/hook.log" 2>&1; then
            cat "${RUNNER_TEMP}/hook.log"; echo "UNEXPECTED: the hook passed the fixture"; exit 1
          fi
          cat "${RUNNER_TEMP}/hook.log"
          grep -q 'RuleID: *talos-token' "${RUNNER_TEMP}/hook.log"
          grep -q 'RuleID: *talos-base64-secret' "${RUNNER_TEMP}/hook.log"
          echo "EXPECTED: the hook blocked the commit (talos-token, talos-base64-secret)"
          git rm -q --cached ci-demo/hook-fixture.yaml
      - name: The same fixture on an allowlisted path is blocked, and the reviewed hook passes it
        run: |
          mv ci-demo/hook-fixture.yaml ci-demo/hook-fixture.yaml.v2
          git add ci-demo/hook-fixture.yaml.v2
          if ${PRE_COMMIT} run > "${RUNNER_TEMP}/hook.log" 2>&1; then
            cat "${RUNNER_TEMP}/hook.log"; echo "UNEXPECTED: the hook passed the fixture"; exit 1
          fi
          cat "${RUNNER_TEMP}/hook.log"
          grep -q 'File: *ci-demo/hook-fixture.yaml.v2' "${RUNNER_TEMP}/hook.log"
          echo "EXPECTED: the hook blocked the commit on an allowlisted path"
          # Control: the reviewed hook with the reviewed config, staged so that
          # pre-commit does not stash it away.
          git show "${REVIEWED}:.gitleaks.toml" > .gitleaks.toml
          git add .gitleaks.toml
          ${PRE_COMMIT} run --config "${RUNNER_TEMP}/reviewed-hook.yaml"
          echo "CONTROL: the reviewed hook and config passed the same staged file"
          git restore --source=HEAD --staged --worktree .gitleaks.toml
          git rm -q --cached ci-demo/hook-fixture.yaml.v2
      - name: A git warning fails the hook, and the reviewed hook passes it
        run: |
          printf '!*.txt\n' > .gitattributes
          git add .gitattributes
          if ${PRE_COMMIT} run > "${RUNNER_TEMP}/hook.log" 2>&1; then
            cat "${RUNNER_TEMP}/hook.log"; echo "UNEXPECTED: the hook passed although git warned"; exit 1
          fi
          cat "${RUNNER_TEMP}/hook.log"
          grep -q 'ERR \[git\]' "${RUNNER_TEMP}/hook.log"
          echo "EXPECTED: the hook blocked the commit because gitleaks logged a git error"
          ${PRE_COMMIT} run --config "${RUNNER_TEMP}/reviewed-hook.yaml"
          echo "CONTROL: the reviewed hook passed the same staged change"
