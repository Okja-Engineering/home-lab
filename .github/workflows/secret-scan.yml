name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Keep this version in step with .pre-commit-config.yaml.
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Full history: the scan reads every commit, so a secret that was added
      # and then removed in a later commit is still found.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release binary, not gitleaks/gitleaks-action: the action needs a
      # license key for repositories owned by an organization.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      # --log-opts replaces gitleaks' default "--full-history --all
      # --diff-filter=tuxdb" with the same options scoped to HEAD: the commit
      # under test and everything it is built on. On a pull request that is
      # the base branch plus the pull request's own commits. "--all" would
      # also read every other branch the checkout fetched, so a finding on an
      # unrelated branch would fail this one.
      # --redact keeps a detected secret out of this public log.
      - name: Scan the commit history
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git
          --config .gitleaks.toml
          --log-opts="--full-history --diff-filter=tuxdb HEAD"
          --redact
          --verbose
          --no-banner
          --log-level debug
