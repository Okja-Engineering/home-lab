name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Keep this version in step with .pre-commit-config.yaml.
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Full history, because the scan reads every commit HEAD is built on: a
      # secret that was added and then removed in a later commit is still
      # found. On a pull request HEAD is GitHub's test merge of the pull
      # request into its base, so that is the base branch's history, every
      # commit of the pull request, and the merge itself. On a push to main it
      # is the history of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release binary, not gitleaks/gitleaks-action: the action needs a
      # license key for repositories owned by an organization.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      # The script holds the gitleaks options and says what they do and do not
      # scan. It also fails the job when gitleaks could not read the history,
      # which gitleaks alone reports as a pass. The pre-commit hook runs the
      # same script on the staged changes.
      - name: Scan the commit history
        run: scripts/secret-scan.sh history

  # DEMONSTRATION ONLY. Not part of story/18-secret-scanning. DO NOT MERGE.
  # The pre-commit hook under the git states of the confirming review's R1.
  # pre-commit itself is installed as the repository's hook, gitleaks is built
  # from the pinned commit, and each step runs a real `git commit`. The
  # invariant each step asserts: a staged fake token is never committed, and a
  # clean change always is. Every step runs even after one fails, so that one
  # run shows every state. The fixture is repeated letters, not key material.
  hook-colour-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pre-commit, the hook, and gitleaks from the pinned commit
        run: |
          pipx install pre-commit==4.7.0
          git config user.name "demonstration"
          git config user.email "demonstration@example.invalid"
          pre-commit install
          pre-commit install-hooks
          git --version
      - name: "Plain git settings: a clean change is committed and a fake token is blocked"
        run: |
          ci-demo/try-commit.sh clean committed "plain git settings"
          ci-demo/try-commit.sh token blocked "plain git settings"
      - name: "color.ui=always: a staged fake token must be blocked"
        if: ${{ !cancelled() }}
        run: |
          git config --global color.ui always
          ci-demo/try-commit.sh token blocked "color.ui=always"
      - name: "color.ui=always: a clean change must be committed"
        if: ${{ !cancelled() }}
        run: |
          git config --global color.ui always
          ci-demo/try-commit.sh clean committed "color.ui=always"
      - name: "Default colour, GIT_PAGER_IN_USE=true, TERM=xterm-256color: a staged fake token must be blocked"
        if: ${{ !cancelled() }}
        env:
          GIT_PAGER_IN_USE: "true"
          TERM: xterm-256color
        run: |
          git config --global --unset-all color.ui || true
          ci-demo/try-commit.sh token blocked "default colour, pager in use"
      - name: "Default colour, GIT_PAGER_IN_USE=true, TERM=xterm-256color: a clean change must be committed"
        if: ${{ !cancelled() }}
        env:
          GIT_PAGER_IN_USE: "true"
          TERM: xterm-256color
        run: |
          git config --global --unset-all color.ui || true
          ci-demo/try-commit.sh clean committed "default colour, pager in use"
