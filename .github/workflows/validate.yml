name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Mondays at 06:17 UTC. This is the run that also checks external links.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# The tools the jobs download are pinned by version and SHA-256. Each SHA-256 is the one the
# release publishes for the linux amd64 file, and the signed source it comes from was verified once
# (2026-10-14), as each comment says. Change a version and its SHA-256 together.
env:
  YQ_VERSION: "4.54.1"
  # yq_linux_amd64: column 19 (SHA-256) of the release's checksums file. cosign verified that file's
  # bundle (checksums.bundle) as signed by
  # https://github.com/mikefarah/yq/.github/workflows/release.yml@refs/tags/v4.54.1
  YQ_SHA256: "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f"

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint YAML
        run: pipx run --spec yamllint==1.38.0 yamllint .

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # Pull requests and pushes check relative links only: --offline checks
          # local files and blocks network requests. The scheduled run leaves it
          # out, so it checks external links as well.
          # Three kinds of URL are never requested in either mode. URLs in code
          # spans and code blocks: lychee skips those unless --include-verbatim
          # is set, so it is not set. Private, link-local and loopback
          # addresses: excluded by --exclude-all-private. Names under home.arpa,
          # the home network's own domain (RFC 8375), which resolve only on that
          # network: excluded by --exclude (a regex; the action passes these
          # arguments through the shell, which removes the quotes).
          args: >-
            --no-progress
            --exclude-all-private
            --exclude 'home\.arpa'
            ${{ github.event_name != 'schedule' && '--offline' || '' }}
            .

  # Generates the Talos machine configs with the documented block, from a throwaway secrets bundle,
  # and checks them. scripts/talos-config-check.sh says what it checks. Nothing is uploaded, and no
  # step prints a generated config, a bundle or a key.
  talos-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # talosctl-linux-amd64 for the TALOS_VERSION that metadata.env pins (v1.14.2), from the
      # release's sha256sum.txt. cosign verified that file's bundle (sha256sum.txt.bundle), and the
      # binary's own bundle, as signed by
      # https://github.com/siderolabs/talos/.github/workflows/ci.yaml@refs/tags/v1.14.2
      # Change it together with TALOS_VERSION.
      TALOSCTL_SHA256: "c6c9552b0e5f767352c595fa1c0af4f186f697488646872955057d23990a66c4"
      SOPS_VERSION: "3.13.3"
      # sops-v3.13.3.linux.amd64, from sops-v3.13.3.checksums.txt. cosign verified that file's
      # bundle (sops-v3.13.3.checksums.sigstore.json) as signed by
      # https://github.com/getsops/sops/.github/workflows/release.yml@refs/tags/v3.13.3
      SOPS_SHA256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
      AGE_VERSION: "1.3.2"
      # age-v1.3.2-linux-amd64.tar.gz, for age-keygen and age-inspect. sigsum-verify v0.13.1 verified
      # its Sigsum proof (the .proof file) with the age keys and policy in age's SIGSUM.md.
      AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
    steps:
      # Full history: the bundle check compares the pull request with its base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Each download is checked against its SHA-256 before it is made executable or unpacked.
      - name: Install talosctl, sops, age and yq
        run: |
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/download"
          mkdir "${bin}" "${dl}"
          fetch() { curl --fail --silent --show-error --location --output "$1" "$2"; }

          talos_version="$(sed -n 's/^TALOS_VERSION="\(v[0-9][0-9.]*\)"$/\1/p' \
            platform/talos/clusters/home-prod/metadata.env)"
          if test -z "${talos_version}"; then
            echo "TALOS_VERSION was not found in platform/talos/clusters/home-prod/metadata.env" >&2
            exit 1
          fi
          fetch "${dl}/talosctl" \
            "https://github.com/siderolabs/talos/releases/download/${talos_version}/talosctl-linux-amd64"
          if ! echo "${TALOSCTL_SHA256}  ${dl}/talosctl" | sha256sum --check; then
            echo "talosctl ${talos_version} does not match TALOSCTL_SHA256. When TALOS_VERSION changes in" >&2
            echo "metadata.env, update TALOSCTL_SHA256 in this workflow with it." >&2
            exit 1
          fi
          install -m 0755 "${dl}/talosctl" "${bin}/talosctl"

          fetch "${dl}/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  ${dl}/sops" | sha256sum --check
          install -m 0755 "${dl}/sops" "${bin}/sops"

          fetch "${dl}/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  ${dl}/age.tar.gz" | sha256sum --check
          tar -xzf "${dl}/age.tar.gz" -C "${dl}" age/age-keygen age/age-inspect
          install -m 0755 "${dl}/age/age-keygen" "${dl}/age/age-inspect" "${bin}/"

          fetch "${dl}/yq" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${dl}/yq" | sha256sum --check
          install -m 0755 "${dl}/yq" "${bin}/yq"

          echo "${bin}" >> "${GITHUB_PATH}"

      # Generated once (issue 19): the encrypted secrets bundle is created once. A pull request may
      # add the first secrets.sops.yaml, but fails if it modifies, deletes or renames one that its
      # base branch has, or if git cannot make the comparison. Rotating the bundle changes this rule
      # on purpose, in its own pull request (issue 28).
      - name: Check that no committed secrets bundle is changed
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only --diff-filter=DMRT "origin/${GITHUB_BASE_REF}...HEAD" \
            -- ':(glob)**/secrets.sops.yaml')"
          if test -n "${changed}"; then
            echo "FAIL: this pull request modifies, deletes or renames a committed secrets bundle:" >&2
            echo "${changed}" >&2
            exit 1
          fi
          echo "ok: no committed secrets.sops.yaml is modified, deleted or renamed"

      # The recipients script runs under sh, which reads a script one command at a time: a syntax
      # error shows only when a run reaches it. A run can stop or exit before then, and under macOS's
      # /bin/sh (bash 3.2) an EXIT trap turns the error into exit 0. So parse the whole file here, with
      # sh (dash on this runner) and with dash by name; both exit 2 on a syntax error anywhere in it.
      - name: Check the recipients script's syntax
        run: |
          echo "sh is $(readlink -f /bin/sh)"
          sh -n scripts/sops-recipients-check.sh
          dash -n scripts/sops-recipients-check.sh
          echo "ok: scripts/sops-recipients-check.sh parses under sh and dash"

      # Until the bundle is committed (issue 19, step 5), the bundle is optional. The pull request
      # that commits it adds --require-bundle here.
      - name: Check the SOPS rule and the secrets bundle
        run: sh scripts/sops-recipients-check.sh

      - name: Generate the Talos configs with the documented block, and check them
        run: scripts/talos-config-check.sh

  # Renders the Cilium chart, pinned by CILIUM_CHART_SHA256, with the cluster's values, and checks
  # the result. scripts/cilium-values-check.sh says what it checks. The render holds generated keys,
  # so it is never printed or uploaded.
  cilium-values:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      HELM_VERSION: "4.3.0"
      # helm-v4.3.0-linux-amd64.tar.gz, from its .sha256sum file. The tarball's OpenPGP signature
      # (its .asc file) was verified against helm's KEYS file: signed by key
      # 208DD36ED5BB3745A16743A4C7C6FBB5B91C1155.
      HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Each download is checked against its SHA-256 before it is made executable or unpacked.
      - name: Install helm and yq
        run: |
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/download"
          mkdir "${bin}" "${dl}"
          fetch() { curl --fail --silent --show-error --location --output "$1" "$2"; }

          fetch "${dl}/helm.tar.gz" "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${dl}/helm.tar.gz" | sha256sum --check
          tar -xzf "${dl}/helm.tar.gz" -C "${dl}" linux-amd64/helm
          install -m 0755 "${dl}/linux-amd64/helm" "${bin}/helm"

          fetch "${dl}/yq" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${dl}/yq" | sha256sum --check
          install -m 0755 "${dl}/yq" "${bin}/yq"

          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Render the Cilium chart with the values, and check it
        run: scripts/cilium-values-check.sh
